<title>Sahyog Care Companion Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a 16:9 SVG "video" stage on top, caption bar, transport controls, chapter chips below. */
:root{
  --bg:#f3f3f7; --surface:#ffffff; --ink:#1b1a26; --muted:#615f75; --line:#cdccd9;
  --accent:#c2358f; --llm:#c2358f; --tool:#6a47d1; --human:#a8710f; --store:#0b8584; --alert:#d23b57;
  --code:#6b6a80;
  --stage:#fbfbfe;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0c14; --surface:#1a1925; --ink:#ecebf5; --muted:#a09fb6; --line:#34324a;
  --accent:#ec5db4; --llm:#ec5db4; --tool:#9d83ff; --human:#e7b04a; --store:#3fcfca; --alert:#ff6b86;
  --code:#9795b0; --stage:#12111b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c14; --surface:#1a1925; --ink:#ecebf5; --muted:#a09fb6; --line:#34324a;
  --accent:#ec5db4; --llm:#ec5db4; --tool:#9d83ff; --human:#e7b04a; --store:#3fcfca; --alert:#ff6b86;
  --code:#9795b0; --stage:#12111b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header h1{font-size:clamp(20px,3vw,28px);margin:0;font-weight:800;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.stagewrap{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9}
#stage{width:100%;height:100%;display:block}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;min-height:84px}
.cap .n{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;padding-top:3px}
.cap p{margin:0;font-size:clamp(15px,1.7vw,18px);line-height:1.45;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:600 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:92px}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13px;padding:6px 10px;color:var(--muted)}
.chips button.on{color:#fff;background:var(--tool);border-color:var(--tool)}
.hint{font-size:12px;color:var(--muted)}
/* SVG */
svg text{fill:var(--ink);font-family:var(--f-body)}
.kick{font:500 14px var(--f-mono);fill:var(--accent)!important;letter-spacing:.12em}
.ttl{font-weight:800;font-size:31px}
.lb{font-weight:600;font-size:15px} .sb{font-size:12.5px;fill:var(--muted)!important}
.tx{font-size:14.5px} .tm{font-size:14.5px;fill:var(--muted)!important}
.big{font-weight:800;font-size:38px}
.mono{font-family:var(--f-mono)!important;font-size:12.5px}
.nd{rx:10;stroke-width:1.6;fill:color-mix(in srgb,var(--c) 15%,var(--surface));stroke:var(--c)}
.k-code{--c:var(--code)}.k-llm{--c:var(--llm)}.k-tool{--c:var(--tool)}.k-human{--c:var(--human)}.k-store{--c:var(--store)}.k-alert{--c:var(--alert)}
.k-ext{--c:var(--muted);stroke-dasharray:5 4}
.ar{fill:none;stroke:var(--muted);stroke-width:1.8} .ar.dash{stroke-dasharray:6 5}
.ar.hot{stroke:var(--accent);stroke-width:2.2}
.ar.flow{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.dot{fill:var(--tool);opacity:.7}.hosp{fill:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.bound{fill:none;stroke:var(--human);stroke-width:2;stroke-dasharray:8 6}
.e>*{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.e.on>*{opacity:1;transform:none}
.e.on>*:nth-child(2){transition-delay:.1s}.e.on>*:nth-child(3){transition-delay:.2s}.e.on>*:nth-child(4){transition-delay:.3s}
.e.on>*:nth-child(5){transition-delay:.4s}.e.on>*:nth-child(6){transition-delay:.5s}.e.on>*:nth-child(7){transition-delay:.6s}
.e.on>*:nth-child(n+8){transition-delay:.7s}
.e.cur .nd{stroke-width:2.6}
.nt .e>*{transition:none!important}.nt #tok{transition:none!important}
#tok{transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .4s;opacity:0}
#tok circle{fill:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}
@media (prefers-reduced-motion:reduce){.e>*,#tok{transition:none!important}.ar.flow{animation:none}}
@media (max-width:640px){.cap{flex-direction:column;gap:4px}.hint{display:none}}
</style>

<div class="wrap">
  <header>
    <h1>Sahyog Care Companion, explained as a walkthrough</h1>
    <p>From the front-desk problem to the LangGraph workflows, memory and caching, and the requirements the client will test. It plays by itself; use the controls to pause, step or jump.</p>
  </header>
  <div class="stagewrap"><svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="Animated diagram"></svg><div class="prog"><i id="pb"></i></div></div>
  <div class="cap" aria-live="polite"><span class="n" id="cn"></span><p id="ct"></p></div>
  <div class="ctl">
    <button id="bps" title="Previous scene">⏮ Scene</button>
    <button id="bp" title="Previous step (←)">◀ Step</button>
    <button id="bplay" class="main" title="Space">⏸ Pause</button>
    <button id="bn" title="Next step (→)">Step ▶</button>
    <button id="bns" title="Next scene">Scene ⏭</button>
    <span class="sp"></span>
    <label class="hint" for="spd">Speed</label>
    <select id="spd"><option value="0.7">0.7×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="hint">Keys: Space play/pause, ← → step, [ ] scene.</div>
</div>

<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const t=(x,y,s,c='tx',a='start')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">`+String(s).split('\n').map((l,i)=>`<tspan x="${x}" dy="${i?1.3:0}em">${esc(l)}</tspan>`).join('')+`</text>`;
function box(x,y,w,h,label,k='code',sub=''){
  const ls=label.split('\n'),n=ls.length,subs=sub?sub.split('\n'):[];
  const tot=(n-1)*18+subs.length*15+(subs.length?3:0);
  let y0=y+h/2-tot/2+5,o=`<g><rect class="nd k-${k}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  ls.forEach((l,i)=>o+=`<text x="${x+w/2}" y="${y0+i*18}" class="lb" text-anchor="middle">${esc(l)}</text>`);
  subs.forEach((l,i)=>o+=`<text x="${x+w/2}" y="${y0+(n-1)*18+17+i*15}" class="sb" text-anchor="middle">${esc(l)}</text>`);
  return o+'</g>';
}
const ar=(x1,y1,x2,y2,c='')=>`<path class="ar ${c}" d="M${x1} ${y1}L${x2} ${y2}" marker-end="url(#ah)"/>`;
const arp=(d,c='')=>`<path class="ar ${c}" d="${d}" marker-end="url(#ah)"/>`;
const legend=y=>[['code','plain code'],['llm','model call'],['tool','tool call'],['human','waits for a human'],['store','store']]
  .map((a,i)=>`<g><rect class="nd k-${a[0]}" x="${48+i*170}" y="${y}" width="16" height="16" rx="4"/>${t(70+i*170,y+13,a[1],'sb')}</g>`).join('');
function tile(x,y,w,h,v,l,k='code'){return `<g><rect class="nd k-${k}" x="${x}" y="${y}" width="${w}" height="${h}"/>${t(x+16,y+h/2+4,v,'big')}${t(x+16,y+h-14,l,'sb')}</g>`}
function card(x,y,w,h,head,body,k='code',hs='lb'){return `<g><rect class="nd k-${k}" x="${x}" y="${y}" width="${w}" height="${h}"/>${t(x+14,y+26,head,hs)}${t(x+14,y+52,body,'tx')}</g>`}
const S=[];

/* 1 ---- client */
function cluster(cx,cy,name,sub){let o='';
  for(let i=0;i<11;i++){const a=i/11*6.283+.4,r=78+(i%3)*10;o+=`<circle cx="${cx+Math.cos(a)*r}" cy="${cy+Math.sin(a)*r*.8}" r="5" class="dot"/>`}
  for(let i=0;i<3;i++){const a=i/3*6.283+1;o+=`<circle cx="${cx+Math.cos(a)*30}" cy="${cy+Math.sin(a)*24}" r="11" class="hosp"/>`}
  return o+t(cx,cy+112,name,'lb','middle')+t(cx,cy+130,sub,'sb','middle')}
S.push({n:'The client',k:'01 · THE CLIENT',h:'A front desk that stopped scaling',steps:[
 {c:'Sahyog Health Network runs 6 hospitals and 22 clinics across Pune and Hyderabad. The client wants one shared platform across both cities. (The client is fictional.)',
  s:cluster(150,290,'Pune','3 hospitals · 11 clinics')+cluster(330,500,'Hyderabad','3 hospitals · 11 clinics')+arp('M180 305Q270 380 305 430','dash')+t(370,400,'one shared platform','sb')},
 {c:'The scale: 3.1M outpatient visits a year and 9,000 appointments a day. 18% of booked patients never arrive.',
  s:tile(480,130,240,110,'3.1M','outpatient visits a year')+tile(740,130,240,110,'9,000','appointments a day')+tile(1000,130,230,110,'18%','booked but never arrive')},
 {c:'The pain, in the client\'s own numbers: 41% of bookings still happen by phone, 2.4M report PDFs are scanned a year, and doctors spend 11 minutes of every consultation typing.',
  s:tile(480,260,240,110,'41%','bookings made by phone','alert')+tile(740,260,240,110,'2.4M','report PDFs scanned a year','alert')+tile(1000,260,230,110,'11 min','typed per consultation','alert')},
 {c:'So the board\'s mandate has three parts: take the phone out of booking, bring patients to their own records, and give the 11 minutes back to the doctor.',
  s:box(480,410,240,80,'Patient books\nwithout a call','llm')+box(740,410,240,80,'Patient sees and\nquestions own records','llm')+box(1000,410,230,80,'Doctor gets a note\nto sign, not type','llm')},
 {c:'Your job as the engineer: the client says what they WANT; you work out what they actually NEED. Every later slide is that translation.',
  s:`<g><rect class="nd k-human" x="480" y="530" width="750" height="90"/>${t(505,566,'Requirement = what the client asks. Need = what you find in discovery.','lb')}${t(505,594,'Example: "an AI doctor-finder" really needs a red-flag gate and human sign-off.','tx')}</g>`}
]});

/* 2 ---- outcomes */
S.push({n:'What they buy',k:'02 · THE MANDATE',h:'Five outcomes, the lines around them',steps:[
 {c:'Five outcomes the client is buying: book in under 3 minutes without a call; see and question your own records with citations; a doctor signs a note after at most 90 seconds of review; every AI output is traceable and reversible by a named human; compliant with India\'s DPDP Act.',
  s:`<g><rect class="nd k-llm" x="48" y="130" width="420" height="520"/>${t(66,160,'OUTCOMES','kick')}${t(66,192,'1  Find the right doctor and book\n    in under 3 minutes, no phone call','tx')}${t(66,262,'2  See and question own records,\n    every answer cited and scoped','tx')}${t(66,332,'3  Doctor signs a note after at most\n    90 seconds of review','tx')}${t(66,402,'4  Every AI output is traceable,\n    auditable, reversible by a human','tx')}${t(66,472,'5  Runs under the DPDP Act, ABDM-ready,\n    path to on-premise handling','tx')}</g>`},
 {c:'In scope: find-my-doctor triage and booking, records upload and Q&A, the consultation scribe, and shared identity, consent, audit and evaluation. Out of scope: billing, video visits, inpatient.',
  s:`<g><rect class="nd k-store" x="490" y="130" width="340" height="250"/>${t(508,160,'IN SCOPE','kick')}${t(508,192,'• Find-my-doctor triage + booking\n• Record upload + questions\n• Consultation scribe, doctor signs\n• Shared platform: identity,\n   consent, audit, evaluation','tx')}</g><g><rect class="nd k-ext" x="490" y="400" width="340" height="250"/>${t(508,430,'OUT OF SCOPE','kick')}${t(508,462,'• Billing and insurance claims\n• Telemedicine video, wearables\n• Inpatient workflows (later)','tx')}</g>`},
 {c:'The constraints shape the architecture: identified health data never leaves India, the LLM vendor must be swappable, hospital data comes read-only via FHIR, pharmacy stock is a nightly CSV, English first, and 1,400 requests an hour at the morning peak.',
  s:`<g><rect class="nd k-human" x="850" y="130" width="380" height="520"/>${t(868,160,'CONSTRAINTS','kick')}${t(868,192,'• Identified data never leaves India\n\n• LLM vendor swappable,\n   no rewrite\n\n• Hospital system: FHIR R4,\n   read-only\n\n• Pharmacy stock: nightly CSV,\n   API promised later\n\n• English first; nothing in the\n   schema assumes English\n\n• Peak: 1,400 requests/hour','tx')}</g>`}
]});

/* 3 ---- RFP addendum */
const rfp=[['Can it diagnose?','No. A red-flag gate runs before any match; wording guardrails on every answer.'],
['Share records with family?','Yes, via a caregiver role. Consent is a table: scope, grantee, expiry.'],
['Where does consultation audio go?','Deleted within 24h. Transcript and note are kept. Deletion writes an audit event.'],
['Identified data to a public LLM?','Only de-identified text may cross. A scrubber sits on the egress path.'],
['Where does stock data come from?','Nightly CSV now, API in ~6 months. One stock interface, two adapters.'],
['Who approves AI-drafted notes?','The consulting doctor, every time. The graph interrupts before saving.'],
['What volume?','9,000 appointments/day, 1,400 requests/hour. Async ingest, stateless API.']];
S.push({n:'RFP rules',k:'03 · THE RFP ADDENDUM',h:'Seven answers that are really requirements',steps:[0,1,2,3].map(i=>({
 c:i==0?'The client\'s Q&A addendum looks conversational but every answer is a design rule. Can it diagnose? No. So a red-flag gate runs first. Can families see records? Yes, so consent is a table with an expiry.':i==1?'Audio is processed and deleted within 24 hours while the transcript and note stay. Identified data never goes to a public LLM, so a scrubber sits at the border.':i==2?'Stock arrives as a nightly CSV today and an API later. So the graph only talks to one stock interface and never knows which adapter is live. Nothing auto-signs: the doctor approves every note.':'Volume is 9,000 appointments a day and 1,400 requests an hour at peak. That is why ingest is asynchronous and the API is stateless. Rule of thumb: every answer is a requirement wearing a conversational tone.',
 s:(i==0?[0,1]:i==1?[2,3]:i==2?[4,5]:[6]).map(j=>{const col=j%4,row=j<4?0:1;return card(48+col*300,130+row*250,285,225,rfp[j][0],rfp[j][1].replace(/(.{1,30})(\s|$)/g,'$1\n').trim(),j<2||j==5?'alert':j==3?'human':'store','lb')}).join('')+(i==3?`<g><rect class="nd k-llm" x="948" y="380" width="285" height="225"/>${t(962,410,'How to read it','lb')}${t(962,438,'Each answer becomes a\n"So:" design rule. Your\nPRD cites the addendum\nline behind every rule.','tx')}</g>`:'')
}))});

/* 4 ---- personas */
const pp=[['Priya, 34','Patient and caregiver','Needs: right specialist\ntonight, and yesterday\'s\nreport in plain words.','Fears: her mother\'s\nreports read by the\nwrong person.','llm'],
['Dr. Rao','Cardiologist, 22 pts/day','Needs: a note he can\nsign in 90 seconds.','Fears: being on record\nfor a line the model\ninvented.','human'],
['Meena','Front desk lead, 300 calls/day','Needs: fewer "which\ndoctor" calls, and a\nqueue she controls.','Fears: a bot booking\nthe wrong slot.','tool'],
['Imran','Pharmacist, two counters','Needs: prescriptions that\nmatch stock before the\npatient walks over.','Fears: substitutions\ndecided by software.','store'],
['Kavita','Compliance officer','Needs: "who saw this\nrecord" in one query.','Fears: identified data in\na public API log.','alert']];
const pc=i=>{const p=pp[i],x=30+i*248;return `<g><rect class="nd k-${p[4]}" x="${x}" y="130" width="232" height="400"/>${t(x+14,164,p[0],'lb')}${t(x+14,184,p[1],'sb')}${t(x+14,230,p[2],'tx')}${t(x+14,350,p[3],'tm')}</g>`};
S.push({n:'Personas',k:'04 · WHO IT SERVES',h:'Five people, one thing each must get',steps:[
 {c:'Priya books for herself and her mother. Dr. Rao needs a note he can sign in 90 seconds. Both fear the AI putting something wrong or private on the record.',s:pc(0)+pc(1)},
 {c:'Meena runs the front desk and wants a queue she still controls. Imran wants prescriptions checked against stock, with the substitution choice left to him. Kavita needs to answer "who saw this record" with one query.',s:pc(2)+pc(3)+pc(4)},
 {c:'Design test for every feature: which of these five does it serve? If none, it is scope creep, and the client is not paying for it. That is why the front desk gets an override view and doctors get a signature gate.',
  s:`<g><rect class="nd k-human" x="30" y="560" width="1220" height="80"/>${t(54,594,'Every epic names its persona. A feature that serves nobody on this page is out.','lb')}${t(54,620,'Front desk override queue · doctor signature gate · pharmacist keeps the substitute choice','tx')}</g>`}
]});

/* 5 ---- context */
S.push({n:'System context',k:'05 · THE BIG PICTURE',h:'Who touches the Companion, and what it depends on',steps:[
 {c:'Five kinds of people use it: the patient on web or app, the doctor on a console, the front desk, the pharmacy, and the compliance officer.',
  s:['Patient (web / app)','Doctor console','Front desk','Pharmacy','Compliance officer'].map((n,i)=>box(48,140+i*100,220,66,n,'llm')).join('')},
 {c:'In the middle is the one system you build: the Sahyog Care Companion. Every arrow follows the direction of the request.',
  s:box(470,230,330,260,'Sahyog Care\nCompanion','tool','the system you build\nLangGraph agents + services')+[0,1,2,3,4].map(i=>ar(268,173+i*100,470,360+(i-2)*40,'hot')).join('')},
 {c:'It depends on outside systems: the hospital system (FHIR, read-only), a pharmacy stock feed, an LLM API that only ever sees de-identified text, a speech-to-text engine, identity and OTP, an SMS gateway, and object and audit stores.',
  s:[['Hospital system · FHIR R4, read-only','ext'],['Pharmacy stock feed · CSV or API','ext'],['LLM API · de-identified text only','human'],['Speech-to-text engine','ext'],['Identity, OTP and ABHA','ext'],['SMS gateway','ext'],['Object + audit stores','store']]
   .map((a,i)=>box(980,120+i*80,250,56,a[0].split(' · ')[0],a[1],a[0].split(' · ')[1]||'')+ar(800,360,980,148+i*80,i==2?'hot dash':'dash')).join('')}
]});

/* 6 ---- two cases */
S.push({n:'Two messages',k:'06 · TWO REAL MESSAGES',h:'The same entry point, two completely different paths',steps:[
 {c:'Two real patient messages. Case A: "my mother (62) has a dull ache in her left arm and breathlessness since this morning, she has diabetes, which doctor?" Case B: "dull lower back pain for three weeks, worse after sitting, no fever."',
  s:`<g><rect class="nd k-alert" x="48" y="130" width="570" height="130"/>${t(66,158,'CASE A · RED FLAG','kick')}${t(66,186,'"Hi, my mother (62) has had a dull ache in her left arm\nand some breathlessness since this morning. She has\ndiabetes. Which doctor should we see?"','tx')}</g><g><rect class="nd k-store" x="660" y="130" width="570" height="130"/>${t(678,158,'CASE B · ROUTINE','kick')}${t(678,186,'"Dull lower back pain for three weeks, worse after long\nsitting. No fever, no weakness in the legs."','tx')}</g>`},
 {c:'Rules run first, in plain code. Case A: arm pain plus breathlessness, over 60, diabetic. A deterministic rule marks a red flag before any model is called. Case B matches no rule, so the model runs.',
  s:box(48,290,570,70,'Rules fire: arm pain + breathlessness + age 60+ + diabetes','alert','plain code, no model involved')+box(660,290,570,70,'No red-flag rule matches, so the specialty match runs','llm','model against the validated crosswalk')},
 {c:'Case A: booking is skipped, an emergency-desk ticket opens with the patient\'s contact, and the patient is told to call 112, without any diagnosis. Case B returns structured output: Orthopaedics, confidence 0.82, three doctors with their next free slot.',
  s:box(48,390,570,70,'Hand-off: emergency-desk ticket + audit event','human','booking path never reached')+box(660,390,570,70,'{ specialty: "Orthopaedics", confidence: 0.82,\n  candidates: 3, next_slot_in: "18 hr" }','llm')},
 {c:'Case A reply: urgent symptoms, call 112, a nurse will call you. It never names a condition. Case B pauses the graph at an interrupt until the patient picks a doctor. Low confidence (under 0.6) asks one clarifying question; two low turns hand the patient to the front desk.',
  s:box(48,490,570,80,'Reply: "Call 112 or go to the nearest ER.\nI have alerted our emergency desk."','alert')+box(660,490,570,80,'interrupt() · run pauses in the checkpointer\nuntil the patient picks a doctor','human')+t(660,610,'confidence < 0.6 → one clarifying question, never a guess','tm')+t(660,634,'two low turns → hand to the front desk','tm')}
]});

/* 7 ---- W1 graph */
const W1=i=>61+i*170,N=(i,l,k,s)=>box(W1(i),250,138,80,l,k,s),mid=i=>[W1(i)+69,290];
const w1ar=i=>ar(W1(i)+138,290,W1(i+1),290);
S.push({n:'W1 Find my doctor',k:'07 · WORKFLOW 1 · LANGGRAPH',h:'Find my doctor: the first graph you ship',steps:[
 {c:'Workflow 1 is one LangGraph graph with shared state (messages, symptoms, age, red_flags, specialty, candidates, chosen_slot, booking_id, audit_ids). First node: intake collects symptoms and age.',tok:mid(0),
  s:legend(150)+N(0,'intake','code','symptoms, age')},
 {c:'Second node is the red-flag check, written as rules, not a prompt. Rules first, model second. If a flag is raised the graph skips everything and hands off to the ER desk.',tok:mid(1),
  s:w1ar(0)+N(1,'red-flag\ncheck','code','rules')+box(W1(1),140,138,60,'ER hand-off','human','ticket + 112')+arp(`M${W1(1)+69} 250L${W1(1)+69} 202`,'dash')},
 {c:'Only now does a model run: match specialty against the validated crosswalk. If confidence is low it loops back for exactly one more question, then matches again.',tok:mid(2),

const defs='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>';
function build(i){const sc=S[i];
  svg.innerHTML=defs+`<g>${t(48,52,sc.k,'kick')}${t(48,92,sc.h,'ttl')}</g>`+sc.steps.map((s,j)=>`<g class="e" data-s="${j}">${s.s||''}</g>`).join('')+'<g id="tok"><circle r="9"/></g>';
  builtFor=i}
function apply(){const sc=S[si];
  svg.querySelectorAll('.e').forEach(g=>{const j=+g.dataset.s;g.classList.toggle('on',j<=st);g.classList.toggle('cur',j==st)});
  let tk,vis=false;for(let j=0;j<=st;j++){const v=sc.steps[j].tok;if(v!==undefined){tk=v;}}
  const tg=svg.querySelector('#tok');
  if(tk){tg.style.transform=`translate(${tk[0]}px,${tk[1]}px)`;tg.style.opacity=1}else tg.style.opacity=0;
  cn.textContent=`${si+1}/${S.length} · ${sc.n} · step ${st+1}/${sc.steps.length}`;ct.textContent=sc.steps[st].c;
  document.querySelectorAll('#chips button').forEach((b,i)=>b.classList.toggle('on',i==si));
}
function go(i,s,anim){
  const rebuild=i!==builtFor;si=i;st=s;
  if(rebuild){build(i);svg.classList.add('nt');apply();void svg.getBoundingClientRect();
    if(anim){svg.classList.remove('nt');svg.querySelectorAll('.e').forEach(g=>g.classList.remove('on'));requestAnimationFrame(()=>requestAnimationFrame(apply))}
    else requestAnimationFrame(()=>svg.classList.remove('nt'))}
  else if(anim)apply();
  else{svg.classList.add('nt');apply();void svg.getBoundingClientRect();svg.classList.remove('nt')}
  sched()}
function dur(){const s=S[si].steps[st];return Math.max(4500,s.c.length*70)/speed}
function sched(){clearTimeout(timer);pb.style.transition='none';pb.style.width='0';
  if(!playing){bplay.textContent='▶ Play';return}
  bplay.textContent='⏸ Pause';const d=dur();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{pb.style.transition=`width ${d}ms linear`;pb.style.width='100%'}));
  timer=setTimeout(next,d)}
function next(){if(st<S[si].steps.length-1)go(si,st+1,true);else if(si<S.length-1)go(si+1,0,true);else{playing=false;sched()}}
function prev(){if(st>0)go(si,st-1,false);else if(si>0)go(si-1,S[si-1].steps.length-1,false)}
function scene(d){const n=Math.min(S.length-1,Math.max(0,si+d));go(n,0,true)}
document.getElementById('bn').onclick=next;document.getElementById('bp').onclick=prev;
document.getElementById('bns').onclick=()=>scene(1);document.getElementById('bps').onclick=()=>scene(-1);
bplay.onclick=()=>{playing=!playing;if(playing&&si==S.length-1&&st==S[si].steps.length-1)go(0,0,true);else sched()};
document.getElementById('spd').onchange=e=>{speed=+e.target.value;sched()};
document.addEventListener('keydown',e=>{if(e.target.tagName=='SELECT')return;
  if(e.key==' '){e.preventDefault();bplay.click()}else if(e.key=='ArrowRight')next();else if(e.key=='ArrowLeft')prev();else if(e.key==']')scene(1);else if(e.key=='[')scene(-1)});
const chips=document.getElementById('chips');
S.forEach((sc,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+sc.n;b.onclick=()=>go(i,0,true);chips.appendChild(b)});
go(0,0,true);
</script>
